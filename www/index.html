<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e27">
    <meta name="application-id" content="com.jull.jull.jull">
    <meta name="package-name" content="com.jull.jull.jull">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: file: https: http:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; connect-src 'self' https: http:; frame-src 'self' https: http:;">
    <title>floating jull</title>
    <style>
        /* =====================================================
           floating jull (com.jull.jull.jull) - "Aurora Premium" Theme
           ===================================================== */
        :root {
            --bg-base: #0a0e27;
            --bg-deep: #050818;
            --surface-1: rgba(15, 23, 42, 0.85);
            --surface-2: rgba(15, 23, 42, 0.75);
            --surface-3: rgba(30, 41, 59, 0.6);

            --primary: #7C3AED;
            --primary-hover: #8B5CF6;
            --primary-glow: rgba(124, 58, 237, 0.4);

            --accent: #22D3EE;
            --accent-hover: #67E8F9;
            --accent-glow: rgba(34, 211, 238, 0.4);

            --secondary: #EC4899;
            --tertiary: #10B981;

            --danger: #EF4444;
            --danger-glow: rgba(239, 68, 68, 0.4);

            --text-primary: #F1F5F9;
            --text-secondary: rgba(241, 245, 249, 0.7);
            --text-tertiary: rgba(241, 245, 249, 0.5);
            --text-on-primary: #FFFFFF;

            --border-subtle: rgba(241, 245, 249, 0.08);
            --border-accent: rgba(34, 211, 238, 0.25);
            --border-primary: rgba(124, 58, 237, 0.3);

            --shadow-window: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            --shadow-window-active: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--accent-glow), 0 0 32px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            --shadow-taskbar: 0 -4px 32px rgba(0, 0, 0, 0.5), 0 -1px 0 rgba(34, 211, 238, 0.15);

            --radius-window: 14px;
            --radius-card: 12px;
            --radius-pill: 999px;

            --ease-premium: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', 'Inter', 'Noto Sans', system-ui, sans-serif;
            color: var(--text-primary);
            background: var(--bg-base);
            font-size: 14px;
            line-height: 1.45;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        .hidden { display: none !important; }

        /* BOOT SCREEN */
        #boot-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(124, 58, 237, 0.35) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, rgba(34, 211, 238, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.25) 0%, transparent 50%),
                linear-gradient(135deg, var(--bg-base) 0%, var(--bg-deep) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s var(--ease-premium);
        }

        #boot-screen.fade-out { opacity: 0; pointer-events: none; }

        .boot-logo {
            animation: bootPulse 2.4s ease-in-out infinite;
            filter: drop-shadow(0 0 24px var(--accent-glow)) drop-shadow(0 0 16px var(--primary-glow));
        }

        .boot-name {
            margin-top: 28px;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-shadow: 0 0 16px var(--accent-glow), 0 0 32px var(--primary-glow);
        }

        .boot-pkg {
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--accent);
            opacity: 0.75;
            font-family: monospace;
        }

        .boot-spinner {
            margin-top: 32px;
            width: 36px;
            height: 36px;
            border: 2px solid rgba(34, 211, 238, 0.15);
            border-top-color: var(--accent);
            border-right-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        @keyframes bootPulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* DESKTOP */
        #desktop {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 20%, rgba(124, 58, 237, 0.22) 0%, transparent 60%),
                radial-gradient(ellipse 70% 50% at 80% 30%, rgba(34, 211, 238, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 50% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 60%),
                linear-gradient(135deg, var(--bg-base) 0%, var(--bg-deep) 50%, var(--bg-base) 100%);
            overflow: hidden;
        }

        #desktop::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 25% 35%, rgba(255, 255, 255, 0.05) 1px, transparent 1.5px),
                radial-gradient(circle at 75% 65%, rgba(34, 211, 238, 0.05) 1px, transparent 1.5px);
            background-size: 40px 40px, 60px 60px;
            pointer-events: none;
        }

        #desktop-default-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            opacity: 0.9;
        }

        #desktop-default-watermark .watermark-main {
            font-size: 38px;
            font-weight: 800;
            color: #22D3EE;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.6), 0 0 40px rgba(124, 58, 237, 0.35);
        }

        #desktop-default-watermark .watermark-sub {
            font-size: 12px;
            color: rgba(241, 245, 249, 0.55);
            letter-spacing: 2px;
            margin-top: 4px;
            font-family: monospace;
        }

        /* DESKTOP ICONS */
        #desktop-icons {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1;
        }

        .desktop-icon {
            width: 82px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s var(--ease-premium), transform 0.15s var(--ease-premium);
        }

        .desktop-icon:hover { background: rgba(34, 211, 238, 0.08); }
        .desktop-icon:active { background: rgba(34, 211, 238, 0.2); transform: scale(0.95); }

        .desktop-icon .icon-img {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.2s var(--ease-premium), box-shadow 0.2s var(--ease-premium);
        }

        .desktop-icon:hover .icon-img {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
        }

        .icon-label {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-primary);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            text-align: center;
            word-break: break-word;
            line-height: 1.15;
        }

        @media (max-width: 380px) {
            #desktop-icons { flex-direction: row; flex-wrap: wrap; max-width: calc(100vw - 32px); }
            .desktop-icon { width: 70px; height: 78px; }
        }

        /* WINDOWS */
        #windows-container {
            position: absolute;
            inset: 0;
            bottom: 64px;
            pointer-events: none;
        }

        .window {
            position: absolute;
            background: var(--surface-1);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-window);
            box-shadow: var(--shadow-window);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
            min-width: 280px;
            min-height: 200px;
            animation: windowOpen 0.24s var(--ease-out-back);
        }

        .window.active {
            box-shadow: var(--shadow-window-active);
            border-color: rgba(34, 211, 238, 0.35);
        }

        @keyframes windowOpen {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .window.closing { animation: windowClose 0.18s var(--ease-premium) forwards; }
        @keyframes windowClose { to { opacity: 0; transform: scale(0.94) translateY(8px); } }

        .window.minimized {
            opacity: 0;
            transform: scale(0.5) translateY(120px);
            pointer-events: none;
            transition: opacity 0.24s, transform 0.24s;
        }

        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0;
        }

        .window-titlebar {
            height: 40px;
            background: linear-gradient(180deg, rgba(124, 58, 237, 0.18) 0%, rgba(34, 211, 238, 0.06) 100%);
            border-bottom: 1px solid rgba(34, 211, 238, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 0 14px;
            cursor: grab;
            flex-shrink: 0;
            touch-action: none;
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .window-icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .window-title-text { overflow: hidden; text-overflow: ellipsis; }
        .window-controls { display: flex; gap: 2px; }

        .window-btn {
            width: 36px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .window-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .window-btn.window-close:hover { background: var(--danger); color: #fff; }

        .window-body {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            background: rgba(10, 14, 39, 0.4);
        }

        .window-resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 24px;
            height: 24px;
            cursor: nwse-resize;
            z-index: 50;
            background: linear-gradient(135deg, transparent 50%, var(--accent) 50%, var(--accent) 60%, transparent 60%, transparent 70%, var(--accent) 70%, var(--accent) 80%, transparent 80%);
            opacity: 0.6;
            touch-action: none;
        }

        .window.maximized .window-resize-handle { display: none; }

        /* SHARED UI & SETTINGS */
        .app-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; color: var(--text-primary); }
        .bs-scroll { flex: 1; overflow-y: auto; padding: 16px; }
        .bs-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 14px;
            margin-bottom: 12px;
        }
        .bs-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .bs-status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .bs-control-row { display: flex; gap: 8px; }
        .bs-shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .bs-shape {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            cursor: pointer;
            font-size: 11px;
        }
        .bs-shape.active {
            background: rgba(34, 211, 238, 0.18);
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }
        .bs-shape-preview {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .bs-shape-circle { border-radius: 50%; }
        .bs-shape-square { border-radius: 0; }
        .bs-shape-rounded { border-radius: 8px; }
        .bs-shape-triangle {
            background: none; border: none; width: 0; height: 0;
            border-left: 16px solid transparent; border-right: 16px solid transparent;
            border-bottom: 28px solid var(--accent);
        }

        .bs-section-accent {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.06), rgba(124, 58, 237, 0.06));
            border: 1px solid rgba(34, 211, 238, 0.25);
        }
        .bs-color-row { display: flex; align-items: center; gap: 10px; }
        .bs-color-swatch-accent { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--accent); flex-shrink: 0; }
        .bs-color-val { flex: 1; font-size: 12px; font-family: monospace; }
        .bs-color-palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0; }
        .bs-color-chip { aspect-ratio: 1; border-radius: 8px; cursor: pointer; padding: 2px; border: 1px solid rgba(255,255,255,0.2); }
        .bs-chip-inner { width: 100%; height: 100%; border-radius: 6px; }
        .bs-color-hsl-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .bs-hsl-label { min-width: 16px; font-size: 11px; font-weight: 700; color: var(--accent); }
        .bs-hsl-slider { flex: 1; height: 6px; border-radius: 3px; }
        .bs-hue-slider { background: linear-gradient(90deg, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%); }
        .bs-sat-slider { background: linear-gradient(90deg, #808080 0%, var(--accent) 100%); }
        .bs-light-slider { background: linear-gradient(90deg, #000000 0%, #808080 50%, #ffffff 100%); }

        .bs-slider-row { display: flex; align-items: center; gap: 12px; }
        .bs-slider { flex: 1; accent-color: var(--accent); height: 4px; }
        .bs-slider-val { min-width: 50px; text-align: right; font-size: 12px; }
        .bs-hint { font-size: 11px; color: var(--text-tertiary); margin-top: 8px; line-height: 1.5; }

        .bs-feature-toggles { display: flex; flex-direction: column; gap: 8px; }
        .bs-feature-toggle {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: rgba(255, 255, 255, 0.04); border-radius: 10px; font-size: 13px;
        }
        .bs-feature-label { display: flex; align-items: center; gap: 10px; }
        .bs-toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
        .bs-toggle input { opacity: 0; width: 0; height: 0; }
        .bs-toggle-slider {
            position: absolute; cursor: pointer; inset: 0;
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border-accent);
            border-radius: 14px; transition: 0.25s;
        }
        .bs-toggle-slider::before {
            content: ""; position: absolute; height: 18px; width: 18px; left: 2px; bottom: 2px;
            background: var(--text-primary); border-radius: 50%; transition: 0.25s;
        }
        .bs-toggle input:checked + .bs-toggle-slider { background: linear-gradient(135deg, var(--primary), var(--accent)); }
        .bs-toggle input:checked + .bs-toggle-slider::before { transform: translateX(20px); background: #fff; }

        .btn {
            background: rgba(34, 211, 238, 0.12);
            border: 1px solid rgba(34, 211, 238, 0.3);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: 1px solid var(--accent);
            color: #fff;
            font-weight: 600;
        }

        /* TASKBAR */
        #taskbar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 64px;
            background: rgba(10, 14, 39, 0.82);
            backdrop-filter: blur(32px);
            border-top: 1px solid rgba(34, 211, 238, 0.18);
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            box-shadow: var(--shadow-taskbar);
        }

        .taskbar-item {
            height: 44px; min-width: 44px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; cursor: pointer; padding: 0 10px;
        }
        .taskbar-item:hover { background: rgba(34, 211, 238, 0.12); }

        #taskbar-apps { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; overflow-x: auto; }
        .taskbar-app {
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; cursor: pointer; position: relative;
        }
        .taskbar-app.active::after {
            content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            width: 18px; height: 3px; border-radius: 2px; background: var(--accent);
        }

        #taskbar-tray { display: flex; align-items: center; margin-left: 8px; gap: 6px; }
        #taskbar-bubble-btn { background: rgba(34, 211, 238, 0.15); border: 1px solid rgba(34, 211, 238, 0.3); }
        #taskbar-close-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); }
        #taskbar-time { text-align: right; font-size: 12px; padding: 8px 10px; line-height: 1.35; }
        #taskbar-time-text { font-weight: 600; }

        /* START MENU */
        #start-menu {
            position: absolute;
            bottom: 72px; left: 50%; transform: translateX(-50%);
            width: 400px; max-width: calc(100vw - 24px);
            background: rgba(10, 14, 39, 0.94);
            backdrop-filter: blur(36px);
            border: 1px solid rgba(34, 211, 238, 0.25);
            border-radius: var(--radius-card);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 32px var(--accent-glow);
            padding: 20px 18px 14px;
            z-index: 99;
        }
        .start-search { margin-bottom: 16px; }
        .start-search input {
            width: 100%; padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-accent);
            border-radius: 10px; color: var(--text-primary); font-size: 13px; outline: none;
        }
        .start-section-title { color: var(--text-secondary); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .start-apps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .start-app {
            display: flex; flex-direction: column; align-items: center;
            padding: 12px 4px; border-radius: 10px; cursor: pointer;
        }
        .start-app:hover { background: rgba(34, 211, 238, 0.1); }
        .start-app-icon { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .start-app-name { font-size: 11px; text-align: center; }
        .start-footer {
            margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between;
        }
        .start-user { display: flex; align-items: center; gap: 10px; }
        .start-user-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            display: flex; align-items: center; justify-content: center; font-weight: 700;
        }
        .start-power { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; }

        /* NOTIFICATIONS */
        #notifications {
            position: fixed; top: 16px; right: 16px; z-index: 9999;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }
        .notification {
            background: rgba(10, 14, 39, 0.95);
            border: 1px solid var(--border-accent);
            border-radius: 10px; padding: 12px 16px;
            color: var(--text-primary); font-size: 13px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Boot Screen -->
    <div id="boot-screen">
        <div class="boot-logo">
            <svg viewBox="0 0 100 100" width="84" height="84">
                <defs>
                    <linearGradient id="bootGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#22D3EE"/>
                        <stop offset="50%" stop-color="#7C3AED"/>
                        <stop offset="100%" stop-color="#EC4899"/>
                    </linearGradient>
                </defs>
                <rect x="10" y="10" width="35" height="35" rx="8" fill="url(#bootGrad)" opacity="0.95"/>
                <rect x="55" y="10" width="35" height="35" rx="8" fill="url(#bootGrad)" opacity="0.75"/>
                <rect x="10" y="55" width="35" height="35" rx="8" fill="url(#bootGrad)" opacity="0.75"/>
                <rect x="55" y="55" width="35" height="35" rx="8" fill="url(#bootGrad)" opacity="0.55"/>
            </svg>
        </div>
        <div class="boot-name">floating jull</div>

    <script>
    /* =====================================================
       floating jull (com.jull.jull.jull) - Core & UI Logic
       ===================================================== */
    const APP_INFO = {
        appName: 'floating jull',
        packageName: 'com.jull.jull.jull',
        version: '3.0.0'
    };

    function notify(message, duration = 2500) {
        const container = document.getElementById('notifications');
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.textContent = message;
        container.appendChild(notif);
        setTimeout(() => notif.remove(), duration);
    }

    /* ---------- Window Manager ---------- */
    const WindowManager = (function() {
        const container = () => document.getElementById('windows-container');
        const taskbarApps = () => document.getElementById('taskbar-apps');
        const windows = new Map();
        let zIndex = 100;
        let activeId = null;
        let nextId = 1;
        const listeners = { focus: [], close: [], minimize: [] };

        function emit(event, payload) {
            (listeners[event] || []).forEach(fn => { try { fn(payload); } catch (e) {} });
        }
        function on(event, fn) {
            if (!listeners[event]) listeners[event] = [];
            listeners[event].push(fn);
        }

        function createWindow(config) {
            const id = config.id || ('win-' + nextId++);
            if (config.singleInstance !== false && windows.has(id)) {
                const existing = windows.get(id);
                if (existing.state === 'minimized') restoreWindow(id);
                focusWindow(id);
                return id;
            }

            const tpl = document.getElementById('window-template');
            const frag = tpl.content.cloneNode(true);
            const winEl = frag.querySelector('.window');

            const width = config.width || Math.min(380, window.innerWidth - 24);
            const height = config.height || Math.min(540, window.innerHeight - 90);
            const offset = (windows.size % 5) * 20;
            const x = Math.max(8, (window.innerWidth - width) / 2 + offset);
            const y = Math.max(12, (window.innerHeight - height - 64) / 2 + offset);

            winEl.style.left = x + 'px';
            winEl.style.top = y + 'px';
            winEl.style.width = width + 'px';
            winEl.style.height = height + 'px';
            winEl.style.zIndex = ++zIndex;

            winEl.querySelector('.window-title-text').textContent = config.title || 'Window';
            if (config.iconHtml) winEl.querySelector('.window-icon').innerHTML = config.iconHtml;

            const body = winEl.querySelector('.window-body');
            if (typeof config.content === 'string') body.innerHTML = config.content;

            winEl.querySelector('.window-close').addEventListener('click', (e) => { e.stopPropagation(); closeWindow(id); });
            winEl.querySelector('.window-minimize').addEventListener('click', (e) => { e.stopPropagation(); minimizeWindow(id); });
            winEl.querySelector('.window-maximize').addEventListener('click', (e) => { e.stopPropagation(); toggleMaximize(id); });

            const titlebar = winEl.querySelector('.window-titlebar');
            winEl.addEventListener('pointerdown', () => focusWindow(id), true);
            makeDraggable(winEl, titlebar, id);

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'window-resize-handle';
            winEl.appendChild(resizeHandle);
            makeResizable(winEl, resizeHandle, id);

            container().appendChild(winEl);

            const taskbarEl = document.createElement('div');
            taskbarEl.className = 'taskbar-app';
            taskbarEl.innerHTML = config.iconHtml || '';
            taskbarEl.addEventListener('click', () => {
                const w = windows.get(id);
                if (!w) return;
                if (w.state === 'minimized') restoreWindow(id);
                else if (activeId === id) minimizeWindow(id);
                else focusWindow(id);
            });
            taskbarApps().appendChild(taskbarEl);

            windows.set(id, { el: winEl, state: 'normal', taskbarEl, prevRect: null });
            focusWindow(id);

            if (config.onReady) requestAnimationFrame(() => config.onReady(body, id));
            return id;
        }

        function makeDraggable(winEl, handle, id) {
            let startX, startY, startLeft, startTop, dragging = false;
            handle.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.window-btn') || winEl.classList.contains('maximized')) return;
                dragging = true;
                startX = e.clientX; startY = e.clientY;
                startLeft = parseInt(winEl.style.left, 10) || 0;
                startTop = parseInt(winEl.style.top, 10) || 0;
                focusWindow(id);
                handle.setPointerCapture(e.pointerId);
            });
            handle.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                winEl.style.left = (startLeft + e.clientX - startX) + 'px';
                winEl.style.top = Math.max(0, startTop + e.clientY - startY) + 'px';
            });
            handle.addEventListener('pointerup', () => { dragging = false; });
        }

        function makeResizable(winEl, handle, id) {
            let startX, startY, startW, startH, resizing = false;
            handle.addEventListener('pointerdown', (e) => {
                if (winEl.classList.contains('maximized')) return;
                resizing = true;
                startX = e.clientX; startY = e.clientY;
                startW = winEl.offsetWidth; startH = winEl.offsetHeight;
                focusWindow(id);
                handle.setPointerCapture(e.pointerId);
                e.stopPropagation();
            });
            handle.addEventListener('pointermove', (e) => {
                if (!resizing) return;
                winEl.style.width = Math.max(260, startW + e.clientX - startX) + 'px';
                winEl.style.height = Math.max(200, startH + e.clientY - startY) + 'px';
            });
            handle.addEventListener('pointerup', () => { resizing = false; });
        }

        function focusWindow(id) {
            activeId = id;
            windows.forEach((w, wid) => {
                if (wid === id) {
                    w.el.style.zIndex = ++zIndex;
                    w.el.classList.add('active');
                    w.taskbarEl.classList.add('active');
                } else {
                    w.el.classList.remove('active');
                    w.taskbarEl.classList.remove('active');
                }
            });
            emit('focus', id);
        }

        function closeWindow(id) {
            const w = windows.get(id);
            if (!w) return;
            w.el.classList.add('closing');
            setTimeout(() => {
                w.el.remove();
                w.taskbarEl.remove();
                windows.delete(id);
                if (activeId === id) {
                    activeId = null;
                    emit('focus', null);
                }
                emit('close', id);
            }, 150);
        }

        function minimizeWindow(id) {
            const w = windows.get(id);
            if (!w) return;
            w.state = 'minimized';
            w.el.classList.add('minimized');
            w.taskbarEl.classList.remove('active');
            if (activeId === id) { activeId = null; emit('focus', null); }
            emit('minimize', id);
        }

        function restoreWindow(id) {
            const w = windows.get(id);
            if (!w) return;
            w.state = w.el.classList.contains('maximized') ? 'maximized' : 'normal';
            w.el.classList.remove('minimized');
            focusWindow(id);
        }

        function toggleMaximize(id) {
            const w = windows.get(id);
            if (!w) return;
            if (w.el.classList.contains('maximized')) {
                w.el.classList.remove('maximized');
                if (w.prevRect) Object.assign(w.el.style, w.prevRect);
                w.state = 'normal';
            } else {
                w.prevRect = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
                w.el.classList.add('maximized');
                w.state = 'maximized';
            }
            focusWindow(id);
        }

        return {
            create: createWindow,
            close: closeWindow,
            closeAll: () => Array.from(windows.keys()).forEach(closeWindow),
            activeId: () => activeId,
            on
        };
    })();

    /* ---------- Apps Definition ---------- */
    const Apps = {};

    Apps.bubbleSettings = {
        iconHtml: '<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="#22D3EE" opacity="0.9"/><circle cx="9" cy="9" r="2" fill="#fff" opacity="0.6"/></svg>',

                    enabledFeatures: ['google_search', 'google_ai', 'translate', 'gallery', 'camera']

            } catch {
                return { shape: 0, alpha: 0.4, scale: 1.0, edgeMargin: 16, customColor: 0, menuSize: 24, menuOpacity: 100, frameBorderOpacity: 100, panelSize: 100, panelOpacity: 100, enabledFeatures: ['google_search','google_ai','translate','gallery','camera'] };
            }
        },

        saveConfig(c) {
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(c));

                AndroidBridge.updateBubbleConfig(JSON.stringify(c));

        },

        open() {
            const cfg = this.getConfig();
            const content = `
                <div class="app-content bubble-settings">

                            <div class="bs-status-row">

                                <button class="btn btn-primary" id="bs-enable-btn">Buka Pengaturan</button>
                            </div>
                        </div>

                        <div class="bs-section">
                            <div class="bs-section-title">Kontrol Bubble</div>
                            <div class="bs-control-row">
                                <button class="btn btn-primary" id="bs-show-btn" style="flex:1">Tampilkan Bubble</button>
                                <button class="btn" id="bs-hide-btn" style="flex:1">Sembunyikan</button>

                                    <div class="bs-shape-preview bs-shape-rounded"></div><div>Bulat</div>
                                </div>

                                <input type="range" min="45" max="100" value="${Math.round(cfg.scale*100)}" id="bs-scale" class="bs-slider">
                                <span class="bs-slider-val" id="bs-scale-val">${Math.round(cfg.scale*100)}%</span>
                            </div>
                        </div>

                        <div class="bs-section">
                            <div class="bs-section-title">Fitur di Menu Bubble</div>
                            <div class="bs-feature-toggles">
                                ${['google_search:Google Search', 'google_ai:Google AI Mode', 'translate:Translate', 'gallery:Gallery', 'camera:Camera'].map(item => {
                                    const [id, label] = item.split(':');
                                    const isOn = cfg.enabledFeatures.includes(id);
                                    return `<div class="bs-feature-toggle">
                                        <span class="bs-feature-label">${label}</span>
                                        <label class="bs-toggle">
                                            <input type="checkbox" data-feature-cb="${id}" ${isOn?'checked':''}>
                                            <span class="bs-toggle-slider"></span>
                                        </label>
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            return WindowManager.create({
                id: 'bubbleSettings',
                title: this.title,
                iconHtml: this.iconHtml,
                content,
                onReady: (body) => {
                    body.querySelector('#bs-enable-btn').addEventListener('click', () => {
                        if (window.AndroidBridge && AndroidBridge.openAccessibilitySettings) AndroidBridge.openAccessibilitySettings();
                        else notify('Membuka Pengaturan Aksesibilitas...');
                    });
                    body.querySelector('#bs-show-btn').addEventListener('click', () => {
                        if (window.AndroidBridge && AndroidBridge.showBubble) AndroidBridge.showBubble();
                        notify('Bubble floating jull ditampilkan!');
                    });
                    body.querySelector('#bs-hide-btn').addEventListener('click', () => {
                        if (window.AndroidBridge && AndroidBridge.hideBubble) AndroidBridge.hideBubble();
                        notify('Bubble disembunyikan');
                    });
                    body.querySelectorAll('.bs-shape').forEach(el => {
                        el.addEventListener('click', () => {
                            body.querySelectorAll('.bs-shape').forEach(s => s.classList.remove('active'));
                            el.classList.add('active');
                            cfg.shape = parseInt(el.dataset.shape);
                            this.saveConfig(cfg);
                        });
                    });
                    body.querySelectorAll('.bs-color-chip').forEach(chip => {
                        chip.addEventListener('click', () => {
                            const c = chip.dataset.color;
                            if (c === '0') {
                                cfg.customColor = 0;
                                body.querySelector('#bs-color-swatch').style.background = 'linear-gradient(135deg,#4FC3F7,#0277BD)';
                                body.querySelector('#bs-color-val').textContent = 'Biru (default)';
                            } else {
                                cfg.customColor = 0xFF000000 | parseInt(c.substring(1), 16);
                                body.querySelector('#bs-color-swatch').style.background = c;
                                body.querySelector('#bs-color-val').textContent = c;
                            }
                            this.saveConfig(cfg);
                        });
                    });
                    body.querySelector('#bs-color-reset').addEventListener('click', () => {
                        cfg.customColor = 0;
                        body.querySelector('#bs-color-swatch').style.background = 'linear-gradient(135deg,#4FC3F7,#0277BD)';
                        body.querySelector('#bs-color-val').textContent = 'Biru (default)';
                        this.saveConfig(cfg);
                    });
                    body.querySelector('#bs-alpha').addEventListener('input', (e) => {
                        cfg.alpha = parseInt(e.target.value) / 100;
                        body.querySelector('#bs-alpha-val').textContent = e.target.value + '%';
                        this.saveConfig(cfg);
                    });
                    body.querySelector('#bs-scale').addEventListener('input', (e) => {
                        cfg.scale = parseInt(e.target.value) / 100;
                        body.querySelector('#bs-scale-val').textContent = e.target.value + '%';
                        this.saveConfig(cfg);
                    });
                    body.querySelectorAll('[data-feature-cb]').forEach(cb => {
                        cb.addEventListener('change', () => {
                            const f = cb.dataset.featureCb;
                            if (cb.checked && !cfg.enabledFeatures.includes(f)) cfg.enabledFeatures.push(f);
                            else if (!cb.checked) cfg.enabledFeatures = cfg.enabledFeatures.filter(x => x !== f);
                            this.saveConfig(cfg);
                        });
                    });
                }
            });
        }
    };

    Apps.scan = {
        iconHtml: '<svg viewBox="0 0 24 24" width="20" height="20"><path fill="#10B981" d="M4,4h6v2H6v4H4V4M14,4h6v6h-2V6h-4V4M4,14h2v4h4v2H4V14M18,14h2v6h-6v-2h4V14M12,10a2,2 0 1,0 0,4a2,2 0 0,0 0,-4z"/></svg>',
        title: 'Scan Setting',
        open() {
            const content = `
                <div class="app-content">
                    <div class="bs-scroll">
                        <div class="bs-section">
                            <div class="bs-section-title">Mode Teks (OCR)</div>
                            <div class="bs-control-row">
                                <button class="btn btn-primary" data-mode="text" style="flex:1">Google Search</button>
                                <button class="btn btn-primary" data-mode="text" style="flex:1">Google AI</button>
                                <button class="btn btn-primary" data-mode="text" style="flex:1">Translate</button>
                            </div>
                        </div>
                        <div class="bs-section">
                            <div class="bs-section-title">Mode Gambar (Screenshot)</div>
                            <div class="bs-control-row">
                                <button class="btn" style="flex:1;background:#10B981;color:#fff;">Google Search</button>
                                <button class="btn" style="flex:1;background:#10B981;color:#fff;">Google AI</button>
                                <button class="btn" style="flex:1;background:#10B981;color:#fff;">Translate</button>
                            </div>
                            <div class="bs-hint" style="margin-top:14px;color:#60A5FA;">
                                💡 Gunakan <strong>Mode Teks</strong> untuk aplikasi dengan proteksi layar (FLAG_SECURE).
                            </div>
                        </div>
                    </div>
                    <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.1);">
                        <button id="scan-save-btn" class="btn btn-primary" style="width:100%;">💾 Simpan Perubahan</button>
                    </div>
                </div>
            `;
            return WindowManager.create({
                id: 'scan',
                title: this.title,
                iconHtml: this.iconHtml,
                content,
                onReady: (body) => {
                    body.querySelector('#scan-save-btn').addEventListener('click', () => {
                        notify('✓ Pengaturan Scan tersimpan!');
                    });
                }
            });
        }
    };

    Apps.tentang = {
        iconHtml: '<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10" fill="#0a0e27" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="8" r="1.5" fill="#fff"/><path d="M11 11h2v7h-2z" fill="#fff"/></svg>',
        title: 'Tentang floating jull',
        open() {
            const content = `
                <div class="app-content" style="padding:24px 20px;overflow-y:auto;">
                    <div style="text-align:center;margin-bottom:20px;">
                        <div style="width:64px;height:64px;margin:0 auto 12px;border-radius:14px;background:linear-gradient(135deg,#22D3EE,#7C3AED);display:flex;align-items:center;justify-content:center;font-size:32px;">⚡</div>
                        <h2 style="margin:0 0 4px;font-size:22px;color:#22D3EE;">${APP_INFO.appName}</h2>
                        <div style="opacity:0.8;font-size:12px;font-family:monospace;">Package: ${APP_INFO.packageName}</div>
                        <div style="opacity:0.6;font-size:11px;margin-top:4px;">Versi Terbaru ${APP_INFO.version}</div>
                    </div>

                    <div style="padding:14px;background:rgba(34,211,238,0.08);border:1.5px solid #22D3EE;border-radius:8px;">
                        <div style="font-weight:bold;color:#22D3EE;margin-bottom:8px;font-size:13px;text-align:center;">📋 Informasi Aplikasi</div>
                        <div style="color:#B3E5FC;font-size:12px;line-height:1.8;">
                            • Nama Aplikasi: <strong>${APP_INFO.appName}</strong><br>
                            • Package Name: <strong>${APP_INFO.packageName}</strong><br>
                            • Tema UI: Aurora Premium Glassmorphism<br>
                            • Fitur: Floating Bubble, OCR Scan, Translate, & AI Search
                        </div>
                    </div>

                    <div style="text-align:center;margin-top:24px;opacity:0.5;font-size:11px;">
                        © 2026 ${APP_INFO.appName} (${APP_INFO.packageName})
                    </div>
                </div>
            `;
            return WindowManager.create({ id: 'tentang', title: this.title, iconHtml: this.iconHtml, content });
        }
    };

    Apps.carapasang = {
        iconHtml: '<svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="5" width="20" height="14" rx="3" fill="#0a0e27" stroke="#fff" stroke-width="1.5"/><path d="M10 9l6 3-6 3z" fill="#fff"/></svg>',
        title: 'Cara Pasang',
        open() {
            const content = `
                <div class="app-content" style="padding:16px;overflow-y:auto;">
                    <h2 style="margin:0 0 8px;font-size:18px;color:#22D3EE;text-align:center;">Panduan Setup ${APP_INFO.appName}</h2>
                    <p style="margin:0 0 14px;font-size:12px;opacity:0.8;text-align:center;">
                        Ikuti langkah-langkah di bawah ini untuk mengaktifkan floating bubble:
                    </p>
                    <div class="bs-section" style="font-size:12px;line-height:1.8;">
                        1. Buka menu <strong>floating jull Bubble</strong> di desktop.<br>
                        2. Tekan tombol <strong>Buka Pengaturan</strong> pada bagian Status Accessibility.<br>
                        3. Cari layanan <strong>${APP_INFO.appName}</strong> di daftar layanan aksesibilitas perangkat Anda dan aktifkan.<br>
                        4. Kembali ke aplikasi dan tekan <strong>Tampilkan Bubble</strong>.
                    </div>
                </div>
            `;
            return WindowManager.create({ id: 'carapasang', title: this.title, iconHtml: this.iconHtml, content });
        }
    };

    window.AppRegistry = Apps;

    /* ---------- Boot & Desktop Initialization ---------- */
    function updateClock() {
        const now = new Date();
        document.getElementById('taskbar-time-text').textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
        document.getElementById('taskbar-date-text').textContent = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function boot() {
        updateClock();
        setInterval(updateClock, 1000);

        document.querySelectorAll('.desktop-icon, .start-app').forEach(el => {
            el.addEventListener('click', () => {
                const appId = el.dataset.app;
                if (window.AppRegistry[appId]) window.AppRegistry[appId].open();
                document.getElementById('start-menu').classList.add('hidden');
            });
        });

        const startBtn = document.getElementById('start-btn');
        const startMenu = document.getElementById('start-menu');
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startMenu.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!startMenu.classList.contains('hidden') && !startMenu.contains(e.target) && !startBtn.contains(e.target)) {
                startMenu.classList.add('hidden');
            }
        });

        document.getElementById('taskbar-bubble-btn').addEventListener('click', () => Apps.bubbleSettings.open());
        document.getElementById('taskbar-settings-btn').addEventListener('click', () => Apps.bubbleSettings.open());

        const closeBtn = document.getElementById('taskbar-close-btn');
        WindowManager.on('focus', (id) => closeBtn.classList.toggle('hidden', !id));
        closeBtn.addEventListener('click', () => {
            const id = WindowManager.activeId();
            if (id) WindowManager.close(id);
        });

        document.getElementById('start-power-btn').addEventListener('click', () => {
            if (confirm('Tutup semua jendela aplikasi?')) {
                WindowManager.closeAll();
                startMenu.classList.add('hidden');
            }
        });

        setTimeout(() => {
            const bootScreen = document.getElementById('boot-screen');
            bootScreen.classList.add('fade-out');
            setTimeout(() => {
                bootScreen.remove();
                document.getElementById('desktop').classList.remove('hidden');
            }, 600);
        }, 1200);
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
    </script>
</body>
</html>
